apiVersion: v1
kind: Service
metadata:
  name: {{ include "spx-lb-controller.fullname" . }}-metrics
  labels:
    {{- include "spx-lb-controller.labels" . | nindent 4 }}
spec:
  type: {{ .Values.metrics.service.type }}
  ports:
    - port: {{ .Values.metrics.service.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "spx-lb-controller.selectorLabels" . | nindent 4 }}
