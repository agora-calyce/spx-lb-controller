{{- if not .Values.api.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "spx-lb-controller.fullname" . }}-api
  labels:
    {{- include "spx-lb-controller.labels" . | nindent 4 }}
type: Opaque
data:
  url: {{ .Values.api.url | b64enc | quote }}
  token: {{ .Values.api.token | b64enc | quote }}
  orgaId: {{ .Values.api.orgaId | b64enc | quote }}
  az: {{ .Values.api.az | b64enc | quote }}
{{- end }}
